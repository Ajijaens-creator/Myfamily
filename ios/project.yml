# Generates FamilyOS.xcodeproj. On the Mac: `brew install xcodegen && cd ios && xcodegen`
name: FamilyOS
options:
  bundleIdPrefix: com.jaensfamily
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # Ajik's Apple Developer Team ID goes here (or pick it in Xcode > Signing)
    CODE_SIGN_STYLE: Automatic
targets:
  FamilyOS:
    type: application
    platform: iOS
    sources:
      - path: FamilyOS
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaensfamily.familyos
        PRODUCT_NAME: Family OS
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FamilyOS/Resources/Info.plist
